name: Daily reminder push

on:
  schedule:
    # GitHubのscheduleは混雑で数十分〜数時間遅れることがある。:00は特に混むので少し早め＆オフピーク分に。
    - cron: '37 10 * * *'   # 10:37 UTC = 19:37 JST 目安（遅延して20時前後に着く想定）
  workflow_dispatch: {}            # 手動テスト送信用
  repository_dispatch:             # 外部の正確なcron(cron-job.org等)から時刻ピッタリに発火させる用
    types: [send-reminder]

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: notify
        run: npm install --omit=dev --no-audit --no-fund
      - name: Send reminders
        working-directory: notify
        run: node send.js
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
